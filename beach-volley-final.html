<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Volley Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: dark preview bar, white sidebar app shell, content column; scores use a navy scoreboard surface. */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F2F5; --fg:#0B0D12; --fg-2:#3D414A; --muted:#626772; --line:#E6E7EB; --line-2:#EFF0F3;
  --accent:#2F6FEB; --accent-hover:#2259C9; --accent-soft:#EBF1FE; --accent-ink:#1E4FB8; --on-accent:#FFFFFF;
  --sun:#F5B400; --sun-soft:#FFF4D6; --sun-ink:#7A5600;
  --teal:#0E8A7E; --teal-soft:#E2F4F1; --violet:#6E56CF; --violet-soft:#EFEBFC;
  --bronze:#9A5420; --bronze-soft:#F6E6D8; --good:#16884F; --good-soft:#E6F5EC; --warn:#A06000; --warn-soft:#FFF1DC; --bad:#C23B32; --bad-soft:#FCE9E7;
  --board:#0B1A3A; --board-2:#13285A; --board-3:#1C3470; --board-fg:#FFFFFF; --board-muted:#A9B6D3; --cyan:#19C3FF;
  --scrim:rgba(8,12,20,.5); --shadow:0 1px 2px rgba(11,13,18,.05),0 8px 24px rgba(11,13,18,.06);
  --f-ui:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --f-display:"Inter Tight",Inter,system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0D12; --surface:#12151C; --surface-2:#1A1E27; --fg:#ECEEF2; --fg-2:#C3C7D0; --muted:#8D93A0; --line:#252A35; --line-2:#1E222C;
  --accent:#5B8DEF; --accent-hover:#79A2F3; --accent-soft:#16233F; --accent-ink:#9DBBF6; --on-accent:#06101F;
  --sun:#F5C342; --sun-soft:#33290F; --sun-ink:#F7D57E; --teal:#3CC2B2; --teal-soft:#0F2C29; --violet:#A390F0; --violet-soft:#231D3D;
  --bronze:#E0A374; --bronze-soft:#33210F; --good:#43C181; --good-soft:#0F2A1C; --warn:#E9A84B; --warn-soft:#33240E; --bad:#EE776D; --bad-soft:#36191A;
  --board:#0E1D40; --board-2:#16295A; --board-3:#1F3672; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0D12; --surface:#12151C; --surface-2:#1A1E27; --fg:#ECEEF2; --fg-2:#C3C7D0; --muted:#8D93A0; --line:#252A35; --line-2:#1E222C;
  --accent:#5B8DEF; --accent-hover:#79A2F3; --accent-soft:#16233F; --accent-ink:#9DBBF6; --on-accent:#06101F;
  --sun:#F5C342; --sun-soft:#33290F; --sun-ink:#F7D57E; --teal:#3CC2B2; --teal-soft:#0F2C29; --violet:#A390F0; --violet-soft:#231D3D;
  --bronze:#E0A374; --bronze-soft:#33210F; --good:#43C181; --good-soft:#0F2A1C; --warn:#E9A84B; --warn-soft:#33240E; --bad:#EE776D; --bad-soft:#36191A;
  --board:#0E1D40; --board-2:#16295A; --board-3:#1F3672; --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--board)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Preview bar */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--board);color:var(--board-fg)}
.pbar-in{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;min-height:46px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ptag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--sun);color:#1E1600;padding:3px 8px;border-radius:5px}
.plabel{font-size:13px;color:var(--board-muted)}
.roles{display:flex;gap:4px;overflow-x:auto;max-width:100%}
.roles button{border:0;background:transparent;color:var(--board-muted);font-weight:600;font-size:13px;padding:5px 12px;border-radius:7px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.roles button:hover{color:var(--board-fg);background:var(--board-2)}
.roles button[aria-pressed="true"]{background:var(--board-fg);color:var(--board)}
.roles i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* App shell */
.app{display:flex;align-items:flex-start}
.side{width:244px;flex:none;position:sticky;top:calc(46px + env(safe-area-inset-top,0px));height:calc(100vh - 46px - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 14px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--board);display:grid;place-items:center;flex:none}
.brand b{display:block;font-weight:700;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.navi{border:0;background:transparent;color:var(--fg-2);display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-align:left;font-weight:500;white-space:nowrap}
.navi svg{color:var(--muted);flex:none}
.navi:hover{background:var(--surface-2)}
.navi[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.navi[aria-current="page"] svg{color:var(--accent)}
.navi span{flex:1}
.badge{min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.whocard{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px}
.whocard .t{min-width:0;line-height:1.25}
.whocard .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.whocard .t small{font-size:12px;color:var(--muted)}
.whocard{flex-wrap:wrap}
.whobtn{width:100%;justify-content:center}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.blue{background:var(--accent-soft);color:var(--accent-ink)}
.av.teal{background:var(--teal-soft);color:var(--teal)}
.av.violet{background:var(--violet-soft);color:var(--violet)}
.av.sun{background:var(--sun-soft);color:var(--sun-ink)}
.av.gray{background:var(--surface-2);color:var(--muted)}
.content{flex:1;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{color:var(--fg);font-weight:500}
.crumb i{font-style:normal;color:var(--line);margin:0 6px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;width:260px;color:var(--muted);background:var(--surface)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:13px}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
main{max-width:1080px;padding-block:28px 72px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
@media (max-width:900px){
  .app{flex-direction:column;align-items:stretch}
  .side{position:static;width:auto;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 12px;border-right:0;border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{padding:0;margin-right:auto}
  .whocard{margin:0;border:0;padding:0}
  .whocard .t{display:none}
  .whobtn{width:auto}
  .topbar{display:none}
  main{padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* Page furniture */
.roleline{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--fg-2);border-radius:10px;padding:9px 14px;margin-bottom:22px;background:var(--surface);border:1px solid var(--line)}
.roleline .dot{width:8px;height:8px;border-radius:50%;flex:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:20px}
h1.page{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
h2.sec{font-size:15px;font-weight:600;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
h2.sec .count{font-weight:500;color:var(--muted)}

/* Controls */
.btn{border:1px solid transparent;background:var(--accent);color:var(--on-accent);font-weight:600;padding:8px 14px;border-radius:8px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;line-height:1.25}
.btn:hover{background:var(--accent-hover)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.quiet{background:transparent;color:var(--accent);padding-inline:6px}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[disabled]:hover{background:var(--accent)}
.btn.ghost[disabled]:hover{background:var(--surface)}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:8px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:500;padding:5px 12px;border-radius:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(11,13,18,.1)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before{display:none}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--accent-soft);color:var(--accent-ink)}
.chip.sun{background:var(--sun-soft);color:var(--sun-ink)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink)}
.tag.finals{background:var(--sun-soft);color:var(--sun-ink)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1100px){.two{grid-template-columns:minmax(0,1fr)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:18px}
.stats>div{padding:16px 18px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
@media (max-width:640px){.stats{grid-template-columns:minmax(0,1fr)}.stats>div+div{border-left:0;border-top:1px solid var(--line)}}
.ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.ico.blue{background:var(--accent-soft);color:var(--accent)}
.ico.teal{background:var(--teal-soft);color:var(--teal)}
.ico.violet{background:var(--violet-soft);color:var(--violet)}
.ico.sun{background:var(--sun-soft);color:var(--sun-ink)}
.stat small{display:block;font-size:12.5px;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat em{font-style:normal;font-size:12.5px;color:var(--good)}
.callout{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));background:var(--accent-soft);margin-bottom:12px}
.callout .t{flex:1;min-width:220px}
.callout .t b{display:block}
.callout .t span{font-size:13px;color:var(--fg-2)}

/* Result cards */
.tcard{display:flex;flex-direction:column;gap:8px;padding:16px 18px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;transition:border-color .15s,box-shadow .15s}
.tcard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.tcard h3{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.01em;margin:2px 0 0}
.tcard .meta{font-size:13px;color:var(--muted)}
.coef{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.winners{margin-top:6px;border-top:1px solid var(--line-2);padding-top:10px;display:grid;gap:6px;font-size:13.5px}
.winners div{display:flex;align-items:center;gap:8px;min-width:0}
.winners svg{color:var(--sun);flex:none}
.winners span{color:var(--muted);width:68px;flex:none}
.winners b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Tables */
.tscroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl.fixed{table-layout:fixed;min-width:560px}
.place{font-family:var(--f-display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;width:64px}
.place small{display:block;font-family:var(--f-ui);font-weight:500;font-size:11px;color:var(--muted);line-height:1}
.medal{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:14px}
.medal.g{background:var(--sun-soft);color:var(--sun-ink)}
.medal.s{background:var(--surface-2);color:var(--fg-2)}
.medal.b{background:var(--bronze-soft);color:var(--bronze)}
.team b{font-weight:600}
.team small{display:block;color:var(--muted);font-size:12.5px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.panel-h span{font-weight:400;color:var(--muted);font-size:13px}

/* Scoreboard */
.board{background:var(--board);color:var(--board-fg);border-radius:12px;overflow:hidden}
.board-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:600;border-bottom:1px solid var(--board-2)}
.board-h span{color:var(--board-muted);font-weight:500;font-size:13px}
.bm{padding:10px 16px 12px;border-bottom:1px solid var(--board-2)}
.bm:last-child{border-bottom:0}
.bm-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}
.bm-row{display:grid;grid-template-columns:minmax(0,1fr) auto 28px;gap:12px;align-items:center;padding:3px 0;color:var(--board-muted)}
.bm-row.win{color:var(--board-fg);font-weight:600}
.bm-tn{overflow-wrap:anywhere}
.bm-sets{display:flex;gap:6px;font-family:var(--f-mono);font-size:13px}
.bm-sets span{min-width:22px;text-align:right}
.bm-sets span.w{color:var(--board-fg);font-weight:600}
.bm-tot{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center;border-radius:6px;line-height:28px}
.bm-row.win .bm-tot{background:var(--cyan);color:var(--board)}
.bm-row:not(.win) .bm-tot{background:var(--board-2)}

/* Athlete list */
.trow{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px}
.trow+.trow{border-top:1px solid var(--line-2)}
.datebox{border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);text-align:center;padding:8px 4px;line-height:1}
.datebox.finals{background:var(--sun-soft);color:var(--sun-ink)}
.datebox b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800}
.datebox span{font-size:11px;font-weight:700;letter-spacing:.06em}
.trow h3{margin:0;font-size:15px;font-weight:600}
.trow .meta{font-size:13px;color:var(--muted)}
.trow .act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.trow{grid-template-columns:52px minmax(0,1fr)}.trow .act{grid-column:1/-1;justify-content:flex-start}}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.step{font-size:12.5px;font-weight:500;padding:3px 10px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.step.done{border-color:transparent;background:var(--good-soft);color:var(--good)}
.step.now{border-color:var(--accent);color:var(--accent-ink)}

/* Schedule */
.srow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.srow:last-child{border-bottom:0}
.when b{display:block;font-family:var(--f-mono);font-size:15px;font-weight:600}
.when span{font-size:12px;color:var(--muted)}
.smeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pending{display:grid;gap:2px}
.pending .vs{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.mini{background:var(--board);border-radius:9px;padding:6px 10px;max-width:460px}
.mini .bm-row{padding:2px 0;font-size:13.5px}
.mini .bm-tot{font-size:16px;line-height:24px}
@media (max-width:640px){.srow{grid-template-columns:minmax(0,1fr)}.when{display:flex;gap:8px;align-items:baseline}}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:8px;width:280px;max-width:100%}
.progress i{display:block;height:100%;background:var(--good)}

/* Overview */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.todo{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.todo:last-child{border-bottom:0}
.todo .txt{flex:1;min-width:0}
.todo .txt b{display:block;font-weight:600}
.todo .txt span{font-size:13px;color:var(--muted)}

/* Entry list */
.band{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--surface-2);font-weight:600;font-size:13.5px;border-bottom:1px solid var(--line)}
.band:not(:first-child){border-top:1px solid var(--line)}
.band .l{display:flex;align-items:center;gap:8px}
.band .l i{width:8px;height:8px;border-radius:50%}
.band span{font-weight:400;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-weight:500}

.banner .grow{flex:1;min-width:200px}
.formula{font-size:13px;color:var(--muted);margin:-8px 0 16px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}

.hint{font-size:12.5px;color:var(--muted)}
.input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:40px}

.fgrid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;text-align:left;font-weight:600;display:flex;flex-direction:column;gap:2px;min-width:140px}
.choice button small{font-weight:400;color:var(--muted);font-size:12.5px}
.choice button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.check{display:flex;align-items:center;gap:8px;font-weight:500}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.err{color:var(--bad);font-size:13px;font-weight:500}

/* Modal */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);color:var(--fg);border-radius:14px;width:100%;max-width:560px;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{max-width:660px}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px 14px}
.mhead h2{margin:0;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.mhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.x{border:0;background:var(--surface-2);width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1;flex:none;color:var(--fg-2)}
.mbody{padding:4px 20px 18px;display:flex;flex-direction:column;gap:16px}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface)}
.wsteps{display:flex;gap:6px;padding:0 20px 16px}
.wsteps div{flex:1;font-size:12px;font-weight:600;color:var(--muted);border-top:3px solid var(--line);padding-top:6px}
.wsteps div.on{color:var(--accent-ink);border-color:var(--accent)}
.wsteps div.done{border-color:var(--good)}
.plist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:290px;overflow:auto}
.pitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-bottom:1px solid var(--line-2);background:var(--surface);text-align:left;width:100%}
.pitem:last-child{border-bottom:0}
.pitem:hover{background:var(--surface-2)}
.pitem[aria-pressed="true"]{background:var(--accent-soft)}
.pitem[disabled]{cursor:not-allowed;opacity:.5;background:var(--surface)}
.pitem .nm{flex:1;min-width:0;font-weight:500}
.pitem .nm small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.pitem[aria-pressed="true"] .radio{border:6px solid var(--accent)}
.summary{background:var(--surface-2);border-radius:10px;padding:12px 14px;font-size:13.5px}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px 64px;gap:8px 10px;align-items:center}
.sgrid .h{font-size:11px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em}
.sgrid .tn{font-weight:600;overflow-wrap:anywhere}
.sgrid input{text-align:center;font-family:var(--f-mono);font-size:19px;font-weight:600;padding:6px;min-height:48px}
.sgrid input.w{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
@media (max-width:480px){.sgrid{grid-template-columns:minmax(0,1fr) 52px 52px 52px}}
.final{background:var(--board);color:var(--board-fg);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:16px}
.final .big{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.final .big span{color:var(--board-muted)}
.final .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--cyan)}
.final.idle{background:var(--surface-2);color:var(--muted)}
.final.bad{background:var(--bad-soft);color:var(--bad)}
.result{font-weight:500;padding:10px 14px;border-radius:9px}
.result.ok{background:var(--good-soft);color:var(--good)}
.result.no{background:var(--surface-2);color:var(--fg-2)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:80;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.back{margin:-6px 0 10px -6px}


/* ===== Public area (visitor) ===== */
.navi .badge{flex:none}
.ptg{flex:none!important;font-size:10px;font-weight:700;letter-spacing:.03em;color:var(--violet);background:var(--violet-soft);border-radius:4px;padding:1px 6px}
.navmore{display:none}
.lnk{border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}

.panel-h .lnk{font-weight:500;color:var(--accent);font-size:13px}
.hero{position:relative;overflow:hidden;background:var(--board);color:var(--board-fg);border-radius:16px;padding:32px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:end;margin-bottom:18px}

.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(245,180,0,.3),transparent 65%);pointer-events:none}
.hero-main,.hero .next{position:relative;z-index:1;min-width:0}
.eyebrow-l{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.hero h1{font-family:var(--f-display);font-size:38px;line-height:1.05;letter-spacing:-.02em;margin:8px 0 10px;text-wrap:balance}
.hero p{color:var(--board-muted);margin:0 0 18px;max-width:46ch}
.btn.hero-ghost{background:transparent;border-color:var(--board-3);color:var(--board-fg)}
.btn.hero-ghost:hover{background:var(--board-2)}
.next{background:var(--board-2);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px}
.next .lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--board-muted)}
.next b{font-family:var(--f-display);font-size:20px}
.next .meta{color:var(--board-muted);font-size:13px}
.next .count{color:var(--board-muted);font-size:14px;margin:4px 0}
.next .count strong{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--sun);margin-right:6px;font-weight:800}
.next .chip{align-self:flex-start}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.champ{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.champ:last-child{border-bottom:0}
.champ small{display:block;font-size:12px;color:var(--muted)}
.champ .lnk{font-weight:600}
.mini-rank{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 20px;padding:12px 16px}
.mini-rank small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.mr{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13.5px}
.mr .lnk{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mr .medal{width:22px;height:22px;font-size:12px;flex:none}
.pan-banner{margin-top:18px;width:100%;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 18px;border-radius:12px;border:1px solid color-mix(in srgb,var(--sun) 35%,var(--line));background:var(--sun-soft);color:var(--fg);cursor:pointer}
.pan-banner .txt{flex:1;min-width:0;font-size:13.5px;color:var(--fg-2)}
.pan-banner .txt b{display:block;color:var(--fg);font-size:15px}
.pan-banner .arr{font-size:20px;color:var(--sun-ink)}
.searchbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface);margin-bottom:12px;color:var(--muted)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rc{display:flex;flex-wrap:wrap;gap:4px}
.rchip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.rchip b{font-weight:600;color:var(--fg)}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.acard{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.acard:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.acard .t{flex:1;min-width:0}
.acard b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard small{font-size:12px;color:var(--muted)}
.tchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--sun-ink);background:var(--sun-soft);border-radius:6px;padding:2px 7px;flex:none}

.prof{display:flex;gap:16px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.av.big{width:64px;height:64px;font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile .ico{width:30px;height:30px;margin-bottom:6px}
.tile small{font-size:12.5px;color:var(--muted)}
.tile b{font-family:var(--f-display);font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.tl{display:grid;grid-template-columns:76px minmax(0,1fr) minmax(0,1fr);gap:4px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.tl:last-child{border-bottom:0}

.morei{display:flex;align-items:center;gap:12px;width:100%;padding:14px 4px;border:0;border-bottom:1px solid var(--line-2);background:none;text-align:left;font-weight:600;font-size:15px;color:var(--fg)}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);padding:22px}

  .nav-extra{display:none!important}
  .navmore{display:flex}

  .ptg{display:none}
  .rankt,.rankt tbody{display:block}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}

/* ---------- public area: data helpers ---------- */
const lnk=(a,full)=>`<button class="lnk" data-act="openA" data-id="${a.id}">${full?esc(a.name):esc(a.first[0]+'. '+a.last)}</button>`;
const SHORTT={th:'Θεσ/νίκη',io:'Ίος',ma:'Μαραθώνας',fi:'Finals'};
const HIST=[2018,2019,2020,2021,2022,2023,2024].map(y=>{const r=rng(y*7919);return {season:y,M:TEAMS.M[Math.floor(r()*6)],W:TEAMS.W[Math.floor(r()*6)]};});
let STATS=null;
function stats(){
  if(STATS)return STATS;
  const st={},get=id=>st[id]||(st[id]={res:[],titles:0,pods:0,w:0,l:0,fin:0,finYears:[]});
  PAST.forEach(t=>['M','W'].forEach(g=>{const R=results(t,g);
    R.stand.forEach(x=>[[x.team.a,x.team.b],[x.team.b,x.team.a]].forEach(([a,p])=>{const o=get(a.id);o.res.push({t,place:x.place,pts:x.pts,partner:p});
      if(x.place===1){o.titles++;if(t.type==='Finals'){o.fin++;o.finYears.push(t.season);}}if(x.place<=3)o.pods++;}));
    R.matches.forEach(m=>{const aw=m.sets.filter(z=>z[0]>z[1]).length*2>m.sets.length;[[m.a,aw],[m.b,!aw]].forEach(([tm,won])=>[tm.a,tm.b].forEach(a=>{won?get(a.id).w++:get(a.id).l++;}));});
  }));
  HIST.forEach(h=>['M','W'].forEach(g=>[h[g].a,h[g].b].forEach(a=>{const o=get(a.id);o.titles++;o.fin++;o.finYears.push(h.season);})));
  return STATS=st;
}
const RANKC={};
function ranking(season,g){
  const k=season+g;if(RANKC[k])return RANKC[k];const st=stats();
  const arr=(g==='M'?MEN:WOMEN).map(a=>{const rs=((st[a.id]||{res:[]}).res).filter(r=>r.t.season===season).sort((x,y)=>y.pts-x.pts);const best=rs.slice(0,3);
    return {a,total:best.reduce((n,r)=>n+r.pts,0),best,played:rs.length};}).sort((x,y)=>y.total-x.total||x.a.last.localeCompare(y.a.last,'el'));
  let rk=0,prev=null;arr.forEach((r,i)=>{if(r.total!==prev){rk=i+1;prev=r.total;}r.rank=rk;});
  return RANKC[k]=arr;
}
function rankOf(a){return ranking(2026,a.g).find(r=>r.a.id===a.id);}
function titleLeaders(g){const st=stats();return Object.values(ATH).filter(a=>g==='all'||a.g===g).map(a=>({a,n:(st[a.id]||{titles:0}).titles})).filter(x=>x.n>0).sort((x,y)=>y.n-x.n||x.a.last.localeCompare(y.a.last,'el'));}
function champions(){
  const recent=PAST.filter(t=>t.type==='Finals').map(t=>({season:t.season,M:results(t,'M').stand[0].team,W:results(t,'W').stand[0].team,real:true}));
  return [...recent,...HIST].sort((x,y)=>y.season-x.season);
}

function setRes(a,b,target){
  if(a===''&&b==='')return null;if(a===''||b==='')return'bad';
  a=+a;b=+b;if(!Number.isInteger(a)||!Number.isInteger(b))return'bad';
  const hi=Math.max(a,b),lo=Math.min(a,b);if(hi<target||hi-lo<2||(hi>target&&hi-lo!==2))return'bad';return a>b?'A':'B';
}
function evalScore(sets){
  const r=[setRes(sets[0][0],sets[0][1],21),setRes(sets[1][0],sets[1][1],21),setRes(sets[2][0],sets[2][1],15)];
  if(r.includes('bad'))return{ok:false,bad:true,msg:`Το σετ ${r.indexOf('bad')+1} δεν είναι έγκυρο. Τα σετ 1–2 πάνε στους 21, το 3ο στους 15, με διαφορά 2.`,r};
  if(!r[0]||!r[1])return{ok:false,msg:'Συμπλήρωσε τα σετ.',r};
  if(r[0]===r[1]){if(r[2])return{ok:false,bad:true,msg:'Ο αγώνας κρίθηκε 2–0, το 3ο σετ μένει κενό.',r};return{ok:true,w:r[0],a:r[0]==='A'?2:0,b:r[0]==='B'?2:0,r};}
  if(!r[2])return{ok:false,msg:'Ισοπαλία 1–1: συμπλήρωσε το 3ο σετ.',r};
  return{ok:true,w:r[2],a:r[2]==='A'?2:1,b:r[2]==='B'?2:1,r};
}
function finalHTML(e,m){
  if(e.ok)return `<div class="final"><div class="big">${e.a}<span> : </span>${e.b}</div><div><div class="lbl">ΤΕΛΙΚΟ</div><div>Νίκη <b>${tl(e.w==='A'?m.a:m.b)}</b></div></div></div>`;
  return `<div class="final ${e.bad?'bad':'idle'}">${e.msg}</div>`;
}
function scoreBody(){
  const m=MATCHES.find(x=>x.id===S.modal.id),s=S.modal.sets,e=evalScore(s);

function wizBody(){

    <div class="field"><span class="lab">Είδος</span><div class="choice">${[['Masters',1,'Συντελεστής ×1'],['Finals',2,'Συντελεστής ×2'],['Νέοι',0.5,'Συντελεστής ×0.5']].map(([k,c,s])=>`<button type="button" data-act="wtype" data-id="${k}" data-c="${c}" aria-pressed="${d.type===k}">${k}<small>${s}</small></button>`).join('')}</div>

    <div class="fgrid"><div class="field"><label for="w_main">Ομάδες στο κύριο ταμπλό</label><select id="w_main" class="input" data-w="main">${[8,12,16,24].map(n=>`<option ${+d.main===n?'selected':''}>${n}</option>`).join('')}</select></div>
     <div class="field"><label for="w_direct">Απευθείας είσοδοι</label>${f('direct','number','min="0"')}</div>
     <div class="field"><label for="w_wc">Wild cards</label>${f('wc','number','min="0"')}</div>
     <div class="field"><label for="w_qual">Ομάδες στα προκριματικά</label>${f('qual','number','min="0"')}</div>

     <div class="field"><label for="w_admin">Admin τουρνουά</label><select id="w_admin" class="input" data-w="admin"><option value="">Αργότερα</option>${ADMINS.filter(a=>a.role==='tadmin').map(a=>`<option ${d.admin===a.name?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div></div>
    <div class="summary" id="wsum">${wizSummary()}</div>`;
}
function wizSummary(){const d=S.modal.d,fq=d.main-d.direct-d.wc;return fq<0?`<span class="err">Οι απευθείας είσοδοι και τα wild cards ξεπερνούν το κύριο ταμπλό.</span>`:`Κύριο ταμπλό <b>${d.main}</b> ομάδες = <b>${d.direct}</b> απευθείας + <b>${d.wc}</b> wild cards + <b>${fq}</b> από προκριματικά${d.qual?` (${d.qual} ομάδες στα προκριματικά)`:''}.`;}
function wizCheck(){
  const d=S.modal.d,s=S.modal.step;
  if(s===1&&!d.name.trim())return'Γράψε όνομα τουρνουά.';
  if(s===1&&!d.venue.trim())return'Γράψε τοποθεσία.';
  if(s===2){if(!d.start||!d.end||!d.regOpen||!d.regClose)return'Συμπλήρωσε όλες τις ημερομηνίες.';
    if(pd(d.end)<pd(d.start))return'Η τελευταία μέρα είναι πριν από την πρώτη.';
    if(pd(d.regClose)<=pd(d.regOpen))return'Οι δηλώσεις πρέπει να κλείνουν μετά το άνοιγμα.';
    if(pd(d.regClose)>=pd(d.start))return'Οι δηλώσεις πρέπει να κλείνουν πριν ξεκινήσει το τουρνουά.';}
  if(s===3){if(!d.cats.length)return'Διάλεξε τουλάχιστον μία κατηγορία.';if(d.main-d.direct-d.wc<0)return'Διόρθωσε τον αριθμό των ομάδων.';}
  return'';
}

  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='overlay'){if(e.target===el)closeModal();return;}
  switch(a){
    case'role':S.role=id;S.openT=null;S.openA=null;S.openAlb=null;closeModal();render();window.scrollTo(0,0);break;
    case'tab':S.tab[S.role]=id;S.openT=null;S.openA=null;S.openAlb=null;closeModal();render();window.scrollTo(0,0);break;
    case'season':S.season=+id;render();break;
    case'openT':S.openT=id;render();window.scrollTo(0,0);break;
    case'closeT':S.openT=null;render();break;
    case'setg':S[el.dataset.key]=id;render();break;
    case'login':S.modal={type:'login'};renderModal();break;
    case'forgot':$('#loginmsg').innerHTML='<div class="result ok">Σου στείλαμε email με σύνδεσμο για νέο κωδικό. Ισχύει για 1 ώρα.</div>';break;
    case'signup':$('#loginmsg').innerHTML='<div class="result no">Ανοίγεις λογαριασμό με email και κωδικό. Αν το email υπάρχει στο μητρώο, συνδέεσαι αυτόματα με το προφίλ αθλητή. Αλλιώς το αίτημα εγκρίνεται από τη γραμματεία.</div>';break;
    case'doLogin':S.role='athlete';closeModal();render();toast('Συνδέθηκες ως '+ATH[ME].name);break;
    case'register':openRegister(id);break;
    case'pick':S.modal.pick=id;document.querySelectorAll('.pitem').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));$('#regsum').innerHTML=regSum();$('#sendReg').disabled=false;break;
    case'sendReg':{const m=S.modal;S.regs.push({t:m.t,partner:m.pick,status:'pending'});(TAKEN[m.t]=TAKEN[m.t]||new Set()).add(m.pick);closeModal();render();toast('Η πρόσκληση στάλθηκε στον/στην '+ATH[m.pick].name);}break;
    case'simAccept':{const r=S.regs.find(x=>x.t===id);r.status='accepted';render();toast(ATH[r.partner].first+' αποδέχτηκε. Η δήλωση επιβεβαιώθηκε.');}break;
    case'cancelReg':{const r=S.regs.find(x=>x.t===id);if(TAKEN[id])TAKEN[id].delete(r.partner);S.regs=S.regs.filter(x=>x.t!==id);render();toast('Η δήλωση ακυρώθηκε και ο συμπαίκτης ενημερώθηκε.');}break;
    case'accept':{const i=S.invites.find(x=>x.id===id);i.status='accepted';S.regs.push({t:i.t,partner:i.from,status:'accepted'});render();toast('Αποδέχτηκες. Η ομάδα σας είναι δηλωμένη.');}break;
    case'decline':{const i=S.invites.find(x=>x.id===id);i.status='declined';render();toast('Απέρριψες την πρόσκληση. '+ATH[i.from].first+' ενημερώθηκε.');}break;
    case'schedF':S.schedF=id;render();break;
    case'schedG':S.schedG=id;render();break;
    case'score':{const m=MATCHES.find(x=>x.id===id);S.modal={type:'score',id,sets:[0,1,2].map(i=>m.sets&&m.sets[i]?[String(m.sets[i][0]),String(m.sets[i][1])]:['',''])};renderModal();}break;
    case'saveScore':{const m=MATCHES.find(x=>x.id===S.modal.id);m.sets=S.modal.sets.filter(s=>s[0]!==''&&s[1]!=='').map(s=>[+s[0],+s[1]]);logA('Καταχώριση σκορ',`${UPC[0].name} · ${m.time} Γήπεδο ${m.court} · ${tl(m.a)} – ${tl(m.b)}`);closeModal();render();toast('Αποθηκεύτηκε. Το σκορ φαίνεται ήδη στη σελίδα του τουρνουά.');}break;
    case'wc':{const s=S.wc[S.listG],tm=TEAMS[S.listG].find(x=>x.id===id);s.has(id)?s.delete(id):s.add(id);logA(s.has(id)?'Wild card':'Αφαίρεση wild card',`${UPC[0].name} · ${tl(tm)}`);render();}break;
    case'publish':{const d=new Date();S.pub[S.listG]=`${d.getDate()} ${MG[d.getMonth()]}, ${p2(d.getHours())}:${p2(d.getMinutes())}`;logA('Δημοσίευση λίστας',`${UPC[0].name} 2027 · ${S.listG==='M'?'Άνδρες':'Γυναίκες'}`);render();toast('Η λίστα δημοσιεύτηκε.');}break;
    case'unpub':S.pub[S.listG]=null;render();break;
    case'claim':{const c=CLAIMS.find(x=>x.id===id);CLAIMS=CLAIMS.filter(x=>x.id!==id);logA(el.dataset.ok==='1'?'Έγκριση αθλητή':'Απόρριψη αιτήματος',`${ATH[c.ath].name} · ${c.acct}`);render();toast(el.dataset.ok==='1'?`Εγκρίθηκε. Ο λογαριασμός συνδέθηκε με ${ATH[c.ath].name}.`:'Το αίτημα απορρίφθηκε και ο χρήστης ενημερώθηκε.');}break;
    case'wizard':openWizard(id);break;
    case'wtype':S.modal.d.type=id;S.modal.d.coef=+el.dataset.c;document.querySelectorAll('[data-act=wtype]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));break;
    case'wnext':{const er=wizCheck();S.modal.err=er;if(!er)S.modal.step++;renderModal();}break;
    case'wback':S.modal.step--;S.modal.err='';renderModal();break;
    case'wsave':{const er=wizCheck();if(er){S.modal.err=er;renderModal();break;}const d=S.modal.d;['main','direct','wc','qual','minAge'].forEach(k=>d[k]=+d[k]);
      if(S.modal.edit){UPC[UPC.findIndex(x=>x.id===S.modal.edit)]=d;toast('Οι αλλαγές αποθηκεύτηκαν.');}
      else{d.id='n'+Date.now();UPC.push(d);UPC.sort((a,b)=>pd(a.start)-pd(b.start));toast('Το τουρνουά δημιουργήθηκε. Οι δηλώσεις ανοίγουν '+dtime(d.regOpen)+'.');}
      logA(S.modal.edit?'Επεξεργασία τουρνουά':'Νέο τουρνουά',d.name);closeModal();S.tab.super='tournaments';render();}break;
    case'more':S.modal={type:'more'};renderModal();break;
    case'openA':S.openA=id;closeModal();render();window.scrollTo(0,0);break;
    case'closeA':S.openA=null;render();break;
    case'goT':{const t=PAST.find(x=>x.id===id);S.openA=null;S.tab[S.role]='results';S.season=t.season;S.openT=id;render();window.scrollTo(0,0);}break;
    case'rankS':S.rankS=+id;render();break;
    case'athG':S.athG=id;render();break;
    case'lang':S.lang=id;render();if(id==='en')toast('Αγγλική έκδοση (Φάση 3): μεταφράζεται όλη η εφαρμογή. Στην προεπισκόπηση αλλάζει το μενού.');break;
    case'openAlb':S.openAlb=id;render();window.scrollTo(0,0);break;
    case'closeAlb':S.openAlb=null;render();break;
    case'galMine':S.galMine=id==='1';render();break;
    case'photo':S.modal={type:'photo',id};renderModal();break;
    case'dl':toast('Η φωτογραφία κατέβηκε σε πλήρη ανάλυση.');break;
    case'share':toast('Ο σύνδεσμος της φωτογραφίας αντιγράφηκε.');break;
    case'addFiles':{const base=(Date.now()%9000)+S.upQueue.length*37;for(let i=0;i<4;i++)S.upQueue.push({seed:base+i*131,team:null});render();}break;
    case'rmFile':S.upQueue.splice(+id,1);render();break;
    case'publishPhotos':{const t=PAST.find(x=>x.id===S.upAlb),A=album(t),n=S.upQueue.length;S.upQueue.forEach((q,i)=>A.photos.unshift({id:t.id+'u'+Date.now()+i,seed:q.seed,team:q.team}));S.upQueue=[];logA('Ανέβασμα φωτογραφιών',`${n} φωτογραφίες · ${t.name} ${t.season}`);render();toast(`Δημοσιεύτηκαν ${n} φωτογραφίες. Οι αθλητές που επισημάνθηκαν ειδοποιήθηκαν.`);}break;
    case'newPost':S.modal={type:'post'};renderModal();break;
    case'savePost':{POSTS.unshift({id:'pp'+Date.now(),ath:ME,t:$('#po_t').value,note:$('#po_note').value.trim()||'Ψάχνω συμπαίκτη.',when:'Τώρα'});closeModal();render();toast('Η αγγελία δημοσιεύτηκε.');}break;
    case'delPost':POSTS=POSTS.filter(p=>p.id!==id);render();toast('Η αγγελία διαγράφηκε.');break;
    case'invitePost':{const p=POSTS.find(x=>x.id===id);if(S.regs.find(r=>r.t===p.t)){toast('Έχεις ήδη δήλωση για αυτό το τουρνουά.');break;}S.regs.push({t:p.t,partner:p.ath,status:'pending'});(TAKEN[p.t]=TAKEN[p.t]||new Set()).add(p.ath);render();toast('Η πρόσκληση στάλθηκε στον/στην '+ATH[p.ath].name);}break;
    case'medUp':S.medOk=true;render();toast('Η νέα κάρτα υγείας ανέβηκε. Ισχύει έως 30 Ιουνίου 2028.');break;
    case'addCal':{const t=UPC.find(x=>x.id===id);toast(`Το ${t.name} μπήκε στο ημερολόγιό σου, με υπενθύμιση πριν κλείσουν οι δηλώσεις.`);}break;
    case'install':toast('Η εφαρμογή μπήκε στην αρχική οθόνη του κινητού.');break;
    case'notifs':S.modal={type:'notifs'};renderModal();NOTIFS.forEach(n=>n.unread=false);renderShell();break;
    case'pay':S.modal={type:'pay',t:id,opt:'all'};renderModal();break;
    case'payopt':S.modal.opt=id;document.querySelectorAll('[data-act=payopt]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));break;
    case'doPay':{const r=S.regs.find(x=>x.t===S.modal.t);r.paid=true;logA('Πληρωμή παραβόλου',`${UPC.find(t=>t.id===r.t).name} · €${S.modal.opt==='all'?FEE:FEE/2}`);closeModal();render();toast('Η πληρωμή ολοκληρώθηκε. Η απόδειξη στάλθηκε με email.');}break;
    case'qr':S.modal={type:'qr',t:id};renderModal();break;
    case'resched':S.modal={type:'resched',id};renderModal();break;
    case'saveResched':{const m=MATCHES.find(x=>x.id===S.modal.id);m.time=$('#rs_time').value;m.court=+$('#rs_court').value;const sms=$('#rs_sms').checked;logA('Αλλαγή προγράμματος',`${tl(m.a)} – ${tl(m.b)} · ${m.time} Γήπεδο ${m.court}`);closeModal();render();toast(sms?'Αποθηκεύτηκε. Οι 4 αθλητές ειδοποιήθηκαν με push και SMS.':'Αποθηκεύτηκε. Οι αθλητές ειδοποιήθηκαν στην εφαρμογή.');}break;
    case'social':S.modal={type:'social',t:id};renderModal();break;
    case'dlCard':toast('Η κάρτα κατέβηκε ως εικόνα 1080×1080.');break;
    case'mkDraw':S.drawn[S.drawG]=true;logA('Δημιουργία ταμπλό',`${UPC[0].name} · ${S.drawG==='M'?'Άνδρες':'Γυναίκες'}`);render();toast('Το ταμπλό δημιουργήθηκε από τη λίστα συμμετοχής.');break;
    case'scan':{const c=checkin().find(x=>!x.at);if(!c){toast('Όλες οι ομάδες έκαναν check-in.');break;}c.at='08:5'+(checkin().filter(x=>x.at).length%10);render();toast('Check-in: '+tl(c.t));}break;
    case'ciMan':{const c=checkin()[+id];c.at='08:58';render();toast('Check-in χειροκίνητα: '+tl(c.t));}break;
    case'wd':{const g=S.listG,before=entryList(g),tm=TEAMS[g].find(x=>x.id===id);S.wd[g].add(id);S.wc[g].delete(id);const after=entryList(g);const up=after.direct.find(x=>!before.direct.includes(x))||after.qual.find(x=>!before.qual.includes(x));logA('Απόσυρση ομάδας',`${UPC[0].name} · ${tl(tm)}`);render();toast(`${tl(tm)}: αποσύρθηκε.${up?` Ανεβαίνει η ${tl(up)}, που ειδοποιήθηκε.`:''}`);}break;
    case'unwd':S.wd[S.listG].delete(id);render();break;
    case'pubNews':{const ti=$('#cn_title').value.trim();if(!ti){toast('Γράψε τίτλο για την ανακοίνωση.');break;}NEWS.unshift({id:'n'+Date.now(),date:'2027-05-20',cat:$('#cn_cat').value,title:ti,text:$('#cn_text').value.trim()||ti});logA('Νέα ανακοίνωση',ti);render();toast('Η ανακοίνωση δημοσιεύτηκε στη σελίδα Νέα.');}break;
    case'readNews':S.modal={type:'news',id};renderModal();break;
    case'export':toast(`Η αναφορά κατέβηκε σε ${id}.`);break;
    case'close':closeModal();break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target,m=S.modal;
  if(el.dataset.pq){S.q[el.dataset.pq]=el.value;const box=$('#'+el.dataset.pq+'-list');if(box)box.innerHTML=el.dataset.pq==='rank'?rankRows():athCards();return;}
  if(!m)return;
  if(el.dataset.in==='q'){m.q=el.value;$('#plist').innerHTML=regList();}
  if(el.dataset.set){const[i,j]=el.dataset.set.split('').map(Number);m.sets[i][j]=el.value.replace(/\D/g,'').slice(0,2);if(el.value!==m.sets[i][j])el.value=m.sets[i][j];
    const ev=evalScore(m.sets),x=MATCHES.find(y=>y.id===m.id);$('#scoreres').innerHTML=finalHTML(ev,x);
    [0,1,2].forEach(a=>[0,1].forEach(b=>$('#s'+a+b).classList.toggle('w',ev.r[a]===(b?'B':'A'))));$('#saveScore').disabled=!ev.ok;}
  if(el.dataset.w&&el.tagName!=='SELECT'){m.d[el.dataset.w]=['direct','wc','qual','minAge'].includes(el.dataset.w)?(+el.value||0):el.value;const s=$('#wsum');if(s)s.innerHTML=wizSummary();}
});
document.addEventListener('change',e=>{
  const el=e.target,m=S.modal;
  if(el.dataset.up){S.upAlb=el.value;render();return;}
  if(el.dataset.tag!==undefined){const q=S.upQueue[+el.dataset.tag],t=PAST.find(x=>x.id===S.upAlb);q.team=[...results(t,'M').stand,...results(t,'W').stand].map(x=>x.team).find(x=>x.id===el.value)||null;return;}
  if(el.dataset.ref){const mm=MATCHES.find(x=>x.id===el.dataset.ref);mm.ref=+el.value;logA('Ορισμός διαιτητή',`${REFS[mm.ref].name} · ${mm.time} Γήπεδο ${mm.court}`);render();toast(`${REFS[mm.ref].name}: ορίστηκε στον αγώνα ${mm.time} · Γήπεδο ${mm.court}.`);return;}
  if(el.dataset.spon){toast('Η θέση του χορηγού ενημερώθηκε.');return;}
  if(!m)return;
  if(el.dataset.cat){const c=el.dataset.cat;m.d.cats=el.checked?[...new Set([...m.d.cats,c])]:m.d.cats.filter(x=>x!==c);}
  if(el.dataset.w&&el.tagName==='SELECT'){m.d[el.dataset.w]=el.dataset.w==='admin'?el.value:+el.value;const s=$('#wsum');if(s)s.innerHTML=wizSummary();}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='adminForm')return;e.preventDefault();
  const n=$('#anm').value.trim(),em=$('#aem').value.trim(),t=$('#atr').value;if(!n||!em)return;
  ADMINS.push({name:n,email:em,role:'tadmin',scope:t,status:'Πρόσκληση εστάλη'});
  const tt=UPC.find(x=>t.startsWith(x.name));if(tt&&!tt.admin)tt.admin=n;render();toast('Η πρόσκληση στάλθηκε στο '+em);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)closeModal();});
render();
</script>

</html>
